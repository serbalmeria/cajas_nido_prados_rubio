function setStatus(t) { status.textContent=t; }
function googleLink(p) { return 'https://www.google.com/maps?q='+p.lat+','+p.lon; }
function drawBox(p, isExtra=false) {
 const marker = L.marker([p.lat,p.lon], {icon:L.divIcon({className:'',html:'<span class="box-label">'+escapeHtml(p.name)+'</span>',iconSize:null,iconAnchor:[10,12]})}).addTo(map);

 '<br><a href="'+googleLink(p)+'" target="_blank" rel="noopener">Abrir en Google Maps</a>';

}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

 if(matches.length===1){map.setView([matches[0].lat,matches[0].lon],18);const m=markers.find(m=>m._boxData===matches[0] || (m._boxData.name===matches[0].name && m._boxData.lat===matches[0].lat));if(m)m.openPopup();}

function formatDistance(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km';}

map.on('click',e=>{

});
document.getElementById('export').addEventListener('click',()=>{

 const kml='<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Cajas nido Prados del Rubio</name>'+placemarks+'</Document></kml>';
 const blob=new Blob([kml],{type:'application/vnd.google-earth.kml+xml;charset=utf-8'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Cajas_nido_Prados_del_Rubio_actualizado.kml';a.click();URL.revokeObjectURL(url);

});
function escapeXml(s){return String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));}
